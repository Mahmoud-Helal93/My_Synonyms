kind = "web"
previewPath = "/"
title = "Synonym Recall Cards"
version = "1.0.0"
id = "artifacts/synonym-recall"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20837

[services.development]
run = "pnpm --filter @workspace/synonym-recall run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/synonym-recall", "run", "build" ]
publicDir = "artifacts/synonym-recall/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20837"
BASE_PATH = "/"
